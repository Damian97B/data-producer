name: data-producer
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.4.amd64
    hostname: zookeeper
    container_name: data-producer-zookeeper
    ports:
      - "2181:2181"
    volumes:
      - ./configurations/zoo.cfg:/conf/zoo.cfg
      - zookeeper_data:/data
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ALLOW_ANONYMOUS_LOGIN: yes
  broker:
    image: confluentinc/cp-kafka:7.9.4.amd64
    hostname: broker
    container_name: data-producer-broker
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TOOLS_LOG4J_LOGLEVEL: ERROR
    volumes:
      - type: bind
        source: ./configuration
        target: /etc/data-producer/
  kafka-ui:
    image: provectuslabs/kafka-ui
    hostname: kafka-ui
    container_name: data-producer-kafka-ui
    depends_on:
      - broker
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: kafkacluster-0
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'broker:29092,localhost:29092,localhost:9092,broker:9092'
  data-producer:
    image: data-producer:0.0.1
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: data-producer-app
    depends_on:
      - broker
    environment:
      KAFKA_BROKERS: broker:9092
volumes:
  zookeeper_data: